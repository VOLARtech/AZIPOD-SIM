# Fetches official chart data for a region (tools/chart/regions/<region>.json): NOAA ENC cells, or
# Rijkswaterstaat inland ENC, bathymetry and buoys, and commits the extracted layers to the `chart-data`
# branch under <region>/<source-set>/. Manual only: the app never downloads charts at run time.
# Build the area pack from them with tools/chart/build_region.py.
name: chart data
on:
  workflow_dispatch:
    inputs:
      region: { description: 'region file in tools/chart/regions (miami, lalb, ijmuiden)', default: 'miami' }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # pyogrio's wheels carry GDAL with the S-57 driver
      - run: pip install -q pyogrio shapely numpy tifffile pyproj
      - run: mkdir -p /tmp/out && cd /tmp/out && python -I "$GITHUB_WORKSPACE/tools/chart/fetch_region.py" "$GITHUB_WORKSPACE/tools/chart/regions/${{ inputs.region }}.json" "/tmp/out/${{ inputs.region }}"
      - name: commit to chart-data branch
        run: |
          trap 'echo "::error::commit step failed at line $LINENO: $BASH_COMMAND"' ERR
          rm -rf "/tmp/out/${{ inputs.region }}/_enc"            # the cells themselves are not kept, only what was extracted
          git config user.name "chart-bot"; git config user.email "chart-bot@users.noreply.github.com"
          git fetch origin chart-data || true
          if git rev-parse --verify origin/chart-data >/dev/null 2>&1; then git checkout -B chart-data origin/chart-data; else git checkout --orphan chart-data; git rm -rqf --cached . ; git clean -fdxq; fi
          # only this region's extract is replaced: other data under the region (osm.json) stays
          dest="${{ inputs.region }}/enc"; rm -rf "$dest"; mkdir -p "$dest"; cp -r "/tmp/out/${{ inputs.region }}/." "$dest/"
          git add "$dest"; git commit -qm "chart data: ${{ inputs.region }}" || echo "no change"
          git push origin chart-data 2>&1 | tail -3 | while read -r l; do echo "::warning::$l"; done; git ls-remote origin chart-data | grep -q . || { echo '::error::push did not land'; exit 1; }
